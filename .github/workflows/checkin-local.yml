name: NewAPI 自动签到

on:
  # 定时执行：UTC 1:00 = 北京时间 9:00
  schedule:
    - cron: '17 1 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      only:
        description: '只跑指定站点（名字或域名关键字，如 hkkkj；留空=全部）'
        required: false
        default: ''
        type: string
      no_email:
        description: '跳过邮件通知'
        required: false
        default: false
        type: boolean

# 防止两次运行重叠加倍登录（部分站点有 429 限流）
concurrency:
  group: newapi-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright Chromium（CF 拦截回退时用到）
        run: playwright install chromium --with-deps

      - name: 准备虚拟显示（Turnstile 需要真实浏览器渲染）
        run: |
          google-chrome --version
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 执行签到
        env:
          TZ: Asia/Shanghai
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          mkdir -p logs
          ARGS=""
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.no_email }}" = "true" ]; then ARGS="$ARGS --no-email"; fi
          echo "运行参数: $ARGS"
          set -o pipefail
          xvfb-run --auto-servernum python -W ignore run_checkin.py $ARGS 2>&1 | tee logs/run.log

      - name: 上传运行日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-log-${{ github.run_number }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
